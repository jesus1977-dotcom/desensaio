<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Desensaio</title>

<style>

/* =========================
   THEME VARIABLES
   (igual às outras páginas)
========================= */

:root {
  --bg-main: #141617;
  --bg-panel: #1b1e20;
  --bg-music: #181b1d;

  --text-main: #e6e6e6;
  --text-muted: #9a9a9a;

  --accent-primary: #1e4d5c;
  --accent-primary-hover: #256273;

  --accent-gold: #f1c27d;
  --accent-gold-hover: #f6d28b;

  --border-soft: #2a2a2a;
}

/* RED MODE 🔴 */
body.red-mode {
  --accent-primary: #b11226;
  --accent-primary-hover: #e63946;

  --accent-gold: #f1c27d;
  --accent-gold-hover: #f6d28b;
}

/* =========================
   BASE
========================= */

body {
  font-family: Arial, sans-serif;
  background: var(--bg-main);
  color: var(--text-main);
  margin: 0;
  padding: 0;
  display: flex;
  align-items: flex-start;
}

button {
  font-family: inherit;
  font-size: 14px;
  padding: 10px 14px;
  border-radius: 25px;
  cursor: pointer;
  transition: all 0.25s ease;
  border: none;
}

/* =========================
   SIDEBAR ESQUERDA
========================= */

#sidebar {
  width: 220px;
  position: sticky;
  top: 20px;
  height: calc(100vh - 40px);
  display: flex;
  flex-direction: column;
}

#sections {
  flex: 1;
  overflow-y: auto;
  margin-bottom: 15px;
}

/* Botões de secção */
#sections button {
  width: 100%;
  margin-bottom: 8px;
  background: var(--accent-primary);
  color: #fff;
  border: 1px solid var(--accent-gold);
  text-align: center;
}

#sections button:hover {
  background: var(--accent-primary-hover);
  box-shadow: 0 0 10px rgba(241, 194, 125, 0.5);
  transform: translateY(-1px);
}

/* =========================
   AUTOSCROLL
========================= */

#controls {
  border-top: 1px solid var(--border-soft);
  padding-top: 10px;
}

#controls button {
  width: 100%;
  margin-bottom: 8px;
  background: var(--accent-primary);
  color: #fff;
  border: 1px solid var(--border-soft);
}

#controls button:hover {
  background: var(--accent-primary-hover);
}

#controls input[type="range"] {
  -webkit-appearance: none;
  width: 100%;
  height: 6px;
  border-radius: 5px;
  background: linear-gradient(
    to right,
    var(--accent-primary),
    var(--accent-gold)
  );
  outline: none;
  margin-top: 8px;
}

#controls input[type="range"]::-webkit-slider-thumb,
#controls input[type="range"]::-moz-range-thumb {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: #fff;
  border: 2px solid var(--accent-primary);
  cursor: pointer;
}

/* =========================
   CONTEÚDO CENTRAL
========================= */

#content {
  flex: 1;
  max-width: 900px;

  display: flex;
  flex-direction: column;

  height: 100vh;
  
  padding: 20px 0 20px 30px;
}


h1 {
  margin-top: 0;
}

.meta {
  color: var(--text-muted);
  margin-bottom: 20px;
}

.section {
  margin-bottom: 40px;
}

.section h2 {
  border-bottom: 1px solid var(--border-soft);
  padding-bottom: 5px;
  margin-bottom: 10px;
}

/* =========================
   ÁREA DA MÚSICA (CRÍTICO)
========================= */

#music {
  background: var(--bg-music);
  padding: 20px 24px;
  border-radius: 18px;
}

/* texto base */
#music pre {
  margin: 0;
  padding: 0;
  font-family: monospace;
  font-size: 20px;
  line-height: 1.15;
  white-space: pre-wrap;
  color: var(--text-main);
}

/* acordes */
.chord-row {
  color: var(--text-main);
  font-weight: normal;
  margin: 0;
  padding: 0;
  line-height: 1.05;
  white-space: pre-wrap;
}

.lyric-row {
  color: var(--text-main);
  font-weight: normal;
  margin: 0 0 2px 0;
  padding: 0;
  line-height: 1.05;
  white-space: pre-wrap;
}

/* =========================
   PAINEL DIREITO
========================= */

#rightPanel {
  width: 320px;
  margin-left: 30px;
}

#rightPanel input,
#rightPanel select,
#rightPanel textarea {
  width: 100%;
  padding: 8px;
  border-radius: 25px;
  border: 1px solid var(--border-soft);
  background: var(--bg-panel);
  color: var(--text-main);
  outline: none;
}

#rightPanel input:focus,
#rightPanel select:focus,
#rightPanel textarea:focus {
  border-color: var(--accent-gold);
}

/* =========================
   BOTÕES ESPECIAIS
========================= */

#editBtn {
  background: var(--accent-gold);
  color: #000;
  font-weight: bold;
}

#editBtn:hover {
  background: var(--accent-gold-hover);
}

  /* =========================
   PAGE HEADER (INDEX)
========================= */

.page-header {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  column-gap: 20px;

  padding-left: 20px;
  padding-right: calc(20px + 16px); /* 👈 reserva espaço do scrollbar */
}

.page-header h1 {
  margin: 0;
  font-size: 26px;
  font-weight: 700;
}

/* zona dos botões */
.page-actions {
  display: flex;
  gap: 12px;
}

  /* =========================
   BOTÕES BRONX E RED MODE — HEADER - CASTRO
========================= */

.btn-random {
  height: 42px;
  padding: 0 20px;

  border-radius: 32px;
  font-weight: 800;
  font-size: 15px;
  text-transform: uppercase;
  letter-spacing: 0.5px;

  color: #ffffff;
  background: linear-gradient(180deg, #8f3a00, #5c2300);
  border: 1px solid var(--accent-gold);

  display: inline-flex;
  align-items: center;
  justify-content: center;

    inset 0 2px 3px rgba(255,255,255,0.15),

}

.btn-random:hover {
  background: linear-gradient(180deg, #a14400, #6a2900);
  transform: translateY(-1px);
  box-shadow:
    inset 0 2px 4px rgba(255,255,255,0.2),

}

.btn-random:active {

    inset 0 -1px 2px rgba(255,255,255,0.1),

}

/* RED MODE HEADER (igual ao home) */
.btn-redmode {

.btn-redmode:hover {

}

body.red-mode .btn-redmode {
  background: linear-gradient(180deg, #7a0000, #4a0000);

}


/* base dos botões do header */
.btn-header {

  border-radius: 26px;

/* hover */

/* active */

/* =========================
   SONG HEADER FIXO (CORRECTO)
========================= */

.song-header {

  /* =========================
   TÍTULO DA MÚSICA (2 LINHAS)
========================= */

.song-title {

}

.song-artist {

}

  #scrollArea {

    margin-top: -120px;

  /* =========================
   MODO VISUALIZAÇÃO (SEM PAINEL)
========================= */

body.view-mode #rightPanel {

}

body.view-mode #content {

  /* =========================

body.view-mode .section h2 {

<script>
/* ======================================================
   PROTECÇÃO ADMIN (FRONTEND)
====================================================== */

const ADMIN_PASSWORD = 'Benfica';
let isAdmin = sessionStorage.getItem('isAdmin') === 'true';

function requireAdmin(action) {
  if (isAdmin) {
    action();
    return;
  }

  const pwd = prompt('Acesso restrito. Palavra-passe:');
  if (pwd === ADMIN_PASSWORD) {
    isAdmin = true;
    sessionStorage.setItem('isAdmin', 'true');
    action();
  } else {
    alert('Password incorrecta.');
  }
}

/* ======================================================
   AUTOSCROLL
====================================================== */

let scrollInterval = null;
let scrolling = false;

function toggleScroll() {
  scrolling ? stopScroll() : startScroll();
}

function startScroll() {
  const container = document.getElementById('scrollArea');

  scrollInterval = setInterval(() => {
    const slider = Number(document.getElementById('speed').value);

// curva exponencial suave (lento no meio, rápido no fim)
const speed = Math.pow(slider / 100, 2) * 6 + 0.2;

container.scrollTop += speed;

  }, 80);

  scrolling = true;
  document.getElementById('scrollBtn').innerText = 'Stop';
}


function stopScroll() {
  clearInterval(scrollInterval);
  scrolling = false;
  document.getElementById('scrollBtn').innerText = 'Play';
}

/* ======================================================
   ESTADO GLOBAL
====================================================== */

let editMode = false;
let newSections = [];

/* ======================================================
   PARÂMETROS URL
====================================================== */

const params = new URLSearchParams(window.location.search);
const fileParam = params.get('song') || params.get('file');
const isNewSong = params.has('new');

  /* ======================================================
   NAVEGAÇÃO AUXILIAR
====================================================== */

function openChords() {
  window.location.href = 'pages/chords.html';
}
  
/* ======================================================
   DOM READY
====================================================== */

document.addEventListener('DOMContentLoaded', () => {

  if (!isNewSong) {
    document.body.classList.add('view-mode');
  }

  if (isNewSong) {
    initCreateMode();
  } else {
    loadExistingSong();
  }

  const hasToken = localStorage.getItem('githubToken');
  if (!hasToken) {
    document.getElementById('tokenSetup').style.display = 'block';
  }
});


/* ======================================================
   MODO CRIAÇÃO
====================================================== */

function initCreateMode() {
  document.body.classList.remove('view-mode');
  newSections = [];

  document.getElementById('createMode').style.display = 'block';
  document.getElementById('titleText').innerText = 'Nova música';
  document.getElementById('meta').innerText = 'Modo criação';
  document.getElementById('sections').innerHTML = '';
  document.getElementById('music').innerHTML = '';
}

/* ======================================================
   CARREGAR MÚSICA EXISTENTE
====================================================== */

function loadExistingSong() {
  if (!fileParam) {
    document.getElementById('music').innerText =
      'Nenhuma música seleccionada.';
    return;
  }

  fetch(`data/songs/${fileParam}`)
    .then(res => {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    })
    .then(song => {
      renderSong(song);
      incrementPlayCount(fileParam); // 👈 conta SEMPRE
    })
    .catch(err => {
      console.error(err);
      document.getElementById('music').innerText =
        'Erro a carregar a música.';
    });
}


  // CASTRO
function openRandom() {
  fetch('data/songs/index.json')
    .then(r => r.json())
    .then(songs => {
      // lê histórico do localStorage
      let history = JSON.parse(localStorage.getItem('lastSongs')) || [];

      // filtra músicas que não estão nas últimas 20
      let available = songs.filter(song => !history.includes(song.file));

      // se todas estiverem no histórico, reseta (evita bloqueio total)
      if (available.length === 0) {
        available = songs;
        history = [];
      }

      // escolhe música aleatória
      const s = available[Math.floor(Math.random() * available.length)];

      // adiciona ao histórico
      history.push(s.file);

      // mantém apenas as últimas 20
      if (history.length > 20) history = history.slice(history.length - 20);

      // salva no localStorage
      localStorage.setItem('lastSongs', JSON.stringify(history));

      // abre música
      window.location = 'index.html?song=' + s.file;
    });
}



function renderSong(song) {
 document.getElementById('artistText').innerText =
  song.meta.artist;

document.getElementById('songText').innerText =
  song.meta.title;


  document.getElementById('meta').innerText =
    `Género: ${song.meta.genre || '-'} | Década: ${song.meta.decade || '-'}`;

  const sectionsDiv = document.getElementById('sections');
  const musicDiv = document.getElementById('music');

  sectionsDiv.innerHTML = '';
  musicDiv.innerHTML = '';

  song.sections.forEach(section => {
    const btn = document.createElement('button');
    btn.innerText = section.label;
    btn.onclick = () =>
      document.getElementById(section.id)
        .scrollIntoView({ behavior: 'smooth' });
    sectionsDiv.appendChild(btn);

    const secDiv = document.createElement('div');
    secDiv.className = 'section';
    secDiv.id = section.id;

    const h2 = document.createElement('h2');
    h2.innerText = section.label;
    secDiv.appendChild(h2);

    const pre = document.createElement('pre');

    pre.innerHTML = section.content
      .map(line => {
        const isChord = /^[A-G][#bm0-9/\s]*$/.test(line.trim());
        return `<div class="${isChord ? 'chord-row' : 'lyric-row'}">
          ${line === '' ? '&nbsp;' : line}
        </div>`;
      })
      .join('');

    secDiv.appendChild(pre);
    musicDiv.appendChild(secDiv);
  });
}

/* ======================================================
   CONTADOR DE PLAYS (INDEX.JSON)
====================================================== */

async function incrementPlayCount(fileName) {
  try {
    const token = localStorage.getItem('githubToken');
    if (!token) return; // público conta visualmente, mas não grava

    const apiUrl =
      'https://api.github.com/repos/jesus1977-dotcom/desensaio/contents/data/songs/index.json';

    // ler index.json
    const res = await fetch(apiUrl, {
      headers: { Authorization: `token ${token}` }
    });
    if (!res.ok) return;

    const file = await res.json();
    const data = JSON.parse(atob(file.content));

    const entry = data.find(e => e.file === fileName);
    if (!entry) return;

    entry.plays = (entry.plays || 0) + 1;

    // gravar de volta
    await fetch(apiUrl, {
      method: 'PUT',
      headers: {
        Authorization: `token ${token}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        message: `Play: ${entry.artist} – ${entry.title}`,
        content: btoa(JSON.stringify(data, null, 2)),
        sha: file.sha
      })
    });

  } catch (e) {
    console.warn('Play não gravado:', e.message);
  }
}

/* ======================================================
   EDITAR
====================================================== */

async function toggleEdit() {
  if (isNewSong) {
    alert('Modo edição só para músicas existentes.');
    return;
  }

  if (!editMode) {
    document.body.classList.remove('view-mode');

    // entrar em modo edição
    editMode = true;

    document.querySelectorAll('pre').forEach(pre => {
      pre.contentEditable = true;
      pre.style.border = '1px dashed #666';
      pre.style.background = '#1a1a1a';
    });

    document.getElementById('editBtn').innerText = '💾 Guardar alterações';
    return;
  }

  // sair e GRAVAR
  try {
    const token = localStorage.getItem('githubToken');
    if (!token) {
      alert('Token GitHub não definido.');
      return;
    }

    const updatedSections = [];
    document.querySelectorAll('.section').forEach(sec => {
      const id = sec.id;
      let label = sec.querySelector('h2').innerText.trim();
      if (!label) {
        throw new Error('Há secções com título vazio.');
      }
      const content = Array.from(
  sec.querySelectorAll('pre > div')
).map(row => row.textContent);

updatedSections.push({ id, label, content });
    });

    const res = await fetch(`data/songs/${fileParam}`);
    const song = await res.json();
    song.sections = updatedSections;

    await githubPutFile(
      `data/songs/${fileParam}`,
      JSON.stringify(song, null, 2),
      `Editar música: ${song.meta.artist} – ${song.meta.title}`,
      token
    );

    alert('Alterações guardadas.');
    location.reload();

  } catch (err) {
    alert(err.message);
    document.getElementById('editBtn').innerText = '✏️ Editar';
    editMode = false;
  }
}

/* ======================================================
   CRIAR SECÇÕES
====================================================== */

function createSectionsFromText() {
  const raw = document.getElementById('rawText').value;

  if (!raw.trim()) {
    alert('Cola primeiro o texto da música.');
    return;
  }

  // Normaliza apenas o tipo de quebra de linha.
  // NÃO mexe nos espaços existentes nas linhas.
  const normalized = raw.replace(/\r\n/g, '\n');

  // Uma linha completamente vazia separa secções.
  // Os espaços das restantes linhas são preservados.
  const blocks = normalized.split(/\n[ \t]*\n/);

  newSections = blocks
    .filter(block => block.trim() !== '')
    .map(block => ({
      id: `sec-${crypto.randomUUID()}`,
      label: '',
      content: block.split('\n')
    }));

  renderNewSections();
}

function renderNewSections() {
  const sectionsDiv = document.getElementById('sections');
  const musicDiv = document.getElementById('music');

  sectionsDiv.innerHTML = '';
  musicDiv.innerHTML = '';

  const SECTION_BASES = [
    'Intro',
    'Verse',
    'Chorus',
    'Bridge',
    'Instrumental',
    'Solo',
    'Outro'
  ];

 function nextLabel(base) {
  const nums = newSections
    .map(s => s.label)
    .filter(l => l && l.startsWith(base)) // ignora vazios
    .map(l => parseInt(l.replace(base, '').trim()))
    .filter(n => !isNaN(n));

  const next = nums.length ? Math.max(...nums) + 1 : 1;
  return `${base} ${next}`;
}


  newSections.forEach((section, index) => {
    const btn = document.createElement('button');
    btn.innerText = section.label || '(sem secção)';
    btn.onclick = () =>
      document.getElementById(section.id).scrollIntoView({ behavior: 'smooth' });
    sectionsDiv.appendChild(btn);

    const secDiv = document.createElement('div');
    secDiv.className = 'section';
    secDiv.id = section.id;

    /* ---------- DROPDOWN DE SECÇÃO (SEM TÍTULO EDITÁVEL) ---------- */

  const select = document.createElement('select');

/* opção neutra (default) */
const placeholder = document.createElement('option');
placeholder.value = '';
placeholder.innerText = '— seleccionar —';
placeholder.disabled = true;
placeholder.selected = true;
select.appendChild(placeholder);

/* opções reais */
SECTION_BASES.forEach(base => {
  const opt = document.createElement('option');
  opt.value = base;
  opt.innerText = base;
  select.appendChild(opt);
});


    const h2 = document.createElement('h2');
    h2.innerText = section.label;

  select.onchange = () => {
  if (!select.value) return;

  const label = nextLabel(select.value);
  section.label = label;
  h2.innerText = label;
};


    secDiv.appendChild(select);
    secDiv.appendChild(h2);

    /* ---------- BOTÃO APAGAR ---------- */

    const delBtn = document.createElement('button');
    delBtn.innerText = '🗑 Apagar secção';
    delBtn.onclick = () => {
      if (confirm('Apagar esta secção?')) {
        newSections.splice(index, 1);
        renderNewSections();
      }
    };
    secDiv.appendChild(delBtn);

    /* ---------- LETRA + ACORDES (SEM ESPAÇAMENTO RIDÍCULO) ---------- */

    const pre = document.createElement('pre');
pre.contentEditable = true;

section.content.forEach(line => {
  const row = document.createElement('div');

  const isChord = /^[A-G][#bm0-9/\s]*$/.test(line.trim());

  row.className = isChord ? 'chord-row' : 'lyric-row';

  // textContent preserva literalmente os espaços do texto.
  row.textContent = line;

  pre.appendChild(row);
});

function syncSectionContent() {
  section.content = Array.from(
    pre.querySelectorAll(':scope > div')
  ).map(row => row.textContent);
}

pre.addEventListener('input', syncSectionContent);
pre.addEventListener('blur', syncSectionContent);

    secDiv.appendChild(pre);
    musicDiv.appendChild(secDiv);
  });
}

/* ======================================================
   GITHUB TOKEN
====================================================== */

function saveToken() {
  const token = document.getElementById('githubToken').value.trim();
  if (!token) {
    alert('Token vazio.');
    return;
  }
  localStorage.setItem('githubToken', token);
  alert('Token guardado no browser.');
}

async function saveNewSong() {
  const btn = document.getElementById('saveBtn');

  try {

    if (btn) btn.disabled = true;

    // 1. VALIDAR
    const artist = document.getElementById('newArtist').value.trim();
    const title  = document.getElementById('newTitle').value.trim();
    const genre  = document.getElementById('newGenre').value;
    const decade = document.getElementById('newDecade').value;

    if (!artist || !title || !genre || !decade || newSections.length === 0) {
      alert('Preenche todos os campos e cria secções.');
      return;
    }

    const token = localStorage.getItem('githubToken');
    if (!token) {
      alert('Token GitHub não definido.');
      return;
    }

    // 2. NOME DO FICHEIRO
    const slug = `${artist}-${title}`
      .toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[^a-z0-9]+/g, '-')
      .replace(/(^-|-$)/g, '');

    const fileName = `${slug}.json`;

    // 3. OBJECTO DA MÚSICA
    const songData = {
      meta: { artist, title, genre, decade },
      sections: newSections
    };

    // 4. CRIAR FICHEIRO DA MÚSICA
    await githubPutFile(
      `data/songs/${fileName}`,
      JSON.stringify(songData, null, 2),
      `Nova música: ${artist} – ${title}`,
      token
    );

// 5. LER INDEX.JSON PELA API (FONTE DE VERDADE)
const indexApiUrl =
  'https://api.github.com/repos/jesus1977-dotcom/desensaio/contents/data/songs/index.json';

const indexRes = await fetch(indexApiUrl, {
  headers: { Authorization: `token ${token}` }
});

if (!indexRes.ok) {
  throw new Error('Não foi possível ler index.json');
}

const indexFile = await indexRes.json();
const indexData = JSON.parse(atob(indexFile.content));

// 6. ACTUALIZAR DADOS
if (!indexData.some(e => e.file === fileName)) {
  indexData.push({
  file: fileName,
  artist,
  title,
  genre,
  decade,
  added: new Date().toISOString(),
  plays: 0
});

}

// 7. GRAVAR INDEX.JSON
await githubPutFile(
  'data/songs/index.json',
  JSON.stringify(indexData, null, 2),
  `Actualizar index: ${artist} – ${title}`,
  token
);


    alert('Música gravada com sucesso.');
    location.href = `index.html?song=${fileName}`;

  } catch (err) {
    console.error(err);
    alert('Erro ao gravar no GitHub.\n' + err.message);
  } finally {
    if (btn) btn.disabled = false;
  }
}


async function githubPutFile(path, content, message, token) {

  const apiUrl = `https://api.github.com/repos/jesus1977-dotcom/desensaio/contents/${path}`;

  let sha = null;

  const res = await fetch(apiUrl, {
    headers: { Authorization: `token ${token}` }
  });

  if (res.ok) {
    const data = await res.json();
    sha = data.sha;
  }

  const body = {
    message,
    content: btoa(unescape(encodeURIComponent(content))),
    sha
  };

  const put = await fetch(apiUrl, {
    method: 'PUT',
    headers: {
      Authorization: `token ${token}`,
      'Content-Type': 'application/json'
    },
    body: JSON.stringify(body)
  });

 if (!put.ok) {
  const err = await put.json();
  throw new Error(err.message || 'Erro GitHub');
}
}
